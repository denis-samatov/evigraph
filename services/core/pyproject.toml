[project]
name = "evigraph-core"
version = "0.1.0"
description = "EviGraph Core: document tagging with provenance, expert review and certified auto-apply"
authors = [
    { name = "denis-samatov", email = "denissamatov470@gmail.com" }
]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "datasketch>=2.0.0",
    "fastapi>=0.142.4",
    "numpy>=2.4.6",
    "orjson>=3.13.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sqlalchemy>=2",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
evigraph-core = "evigraph_core.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.168.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "NPY", "S", "DTZ"]
ignore = ["PLR0913", "PLR2004", "S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"src/evigraph_core/cli.py" = ["PLC0415", "PLR0915", "PLR0917"]  # lazy imports keep `--help` fast; demo script
"tests/*" = ["S", "PLR", "RUF001"]  # Russian fixtures test the Cyrillic path
"migrations/*" = ["E501"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
pythonpath = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
