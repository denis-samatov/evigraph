[project]
name = "evigraph-research"
version = "0.1.0"
description = "EviGraph research spike: MultiEURLEX, EUR-Lex graph, splits, baselines"
authors = [
    { name = "denis-samatov", email = "denissamatov470@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "datasketch>=2.0.0",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "orjson>=3.12.0",
    "pandas>=3.0.6",
    "psutil>=7.2.2",
    "pyarrow>=25.0.1",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "torch>=2.14.1",
    "transformers>=5.19.0",
    "typer>=0.27.3",
]

[project.scripts]
evigraph-research = "evigraph_research.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "NPY"]
ignore = ["PLR0913", "PLR0915", "PLR2004"]

[tool.ty.environment]
python-version = "3.11"

[tool.ruff.lint.per-file-ignores]
"src/evigraph_research/cli.py" = ["PLC0415"]  # lazy imports keep `--help` fast
